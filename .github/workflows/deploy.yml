name: Deploy

# Drives Vercel via its CLI so GitHub Actions owns the deploy:
#   push to main   -> production deploy
#   pull_request   -> preview deploy (comment left on the PR)
#
# Requires three repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       - https://vercel.com/account/tokens
#   VERCEL_ORG_ID      - from `.vercel/project.json` after `vercel link`, or Team Settings
#   VERCEL_PROJECT_ID  - from `.vercel/project.json` after `vercel link`, or Project Settings
#
# Double deploys are already prevented: apps/web/vercel.json sets
# git.deploymentEnabled=false, so Vercel ignores pushes and this workflow is the
# only thing that deploys. (That file lives in apps/web because it's the Vercel
# project's Root Directory — move it if you change that setting.)

on:
  push:
    branches: [main]
  pull_request:

# One in-flight deploy per branch; newer pushes cancel stale runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# Least-privilege GITHUB_TOKEN: the deploy needs nothing writable except the
# ability to post/update the preview-URL comment on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Vercel (${{ github.event_name == 'push' && 'production' || 'preview' }})
    runs-on: ubuntu-latest
    # Skip PRs from forks: secrets aren't exposed to them, so the deploy can't run.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      # vercel build runs the project's own build, which uses pnpm — it must be
      # on PATH on the runner (otherwise: "Error: spawn pnpm ENOENT").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.flags.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.flags.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.flags.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel ${{ steps.flags.outputs.environment }} deploy"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview-url -->';
            const body = `${marker}\n**Preview deploy:** ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
