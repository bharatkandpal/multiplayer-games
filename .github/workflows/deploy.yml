name: Deploy

# Drives Vercel via its CLI so GitHub Actions owns the deploy:
#   push to main   -> production deploy
#   pull_request   -> preview deploy (comment left on the PR)
#
# Two Vercel projects deploy from this one repo, as a matrix:
#   web  -> `mpg`      (Root Directory apps/web) — the Vite SPA + unfurl shim
#   api  -> `mpg-api`  (Root Directory apps/api) — stateless functions + Neon
#
# Each runs from the repo root; Vercel resolves the app from the project's own
# Root Directory setting, which is what makes the pnpm workspace deps resolve.
#
# Requires four repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN           - https://vercel.com/account/tokens
#   VERCEL_ORG_ID          - from `.vercel/project.json` after `vercel link`, or Team Settings
#   VERCEL_PROJECT_ID      - the `mpg` project id (web)
#   VERCEL_API_PROJECT_ID  - the `mpg-api` project id
#
# Optional fifth secret:
#   VERCEL_AUTOMATION_BYPASS_SECRET - Protection Bypass for Automation token
#     (Vercel project -> Settings -> Deployment Protection). Without it the
#     post-deploy smoke step cannot reach PREVIEW deployments and will warn
#     rather than verify. Do not disable Deployment Protection instead:
#     previews are wired to the real dev database (MPG-139).
#
# Double deploys are prevented per project by `git.deploymentEnabled=false` in
# each app's vercel.json, so Vercel ignores pushes and this workflow is the only
# thing that deploys. (Those files live in each app dir because that's the
# project's Root Directory — move them if you change that setting.)
#
# The two projects deploy independently (fail-fast is off): a broken API build
# must not block shipping the client, which stays playable with the API absent.

on:
  push:
    branches: [main]
  pull_request:

# One in-flight deploy per branch; newer pushes cancel stale runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

# Least-privilege GITHUB_TOKEN: the deploy needs nothing writable except the
# ability to post/update the preview-URL comment on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Vercel ${{ matrix.app }} (${{ github.event_name == 'push' && 'production' || 'preview' }})
    runs-on: ubuntu-latest
    # Skip PRs from forks: secrets aren't exposed to them, so the deploy can't run.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      # Deploy both even if one fails — see header.
      fail-fast: false
      matrix:
        include:
          - app: web
            project_id_secret: VERCEL_PROJECT_ID
            # Exercises the unfurl function (ADR 0009). A junk token is the
            # documented degrade-to-shell path, so 200 is the correct answer —
            # and it proves the function BOOTED, which is the point.
            #
            # NOTE what this canNOT prove: the degraded shell is byte-identical
            # to what a *misconfigured* shim returns, so this probe passes just
            # as happily when the deployment has no API origin and no share link
            # can ever unfurl. That was live for a month. The "Verify the web
            # app is wired to the API" step below is the gate for that half.
            smoke_path: /s/deploysmoketoken
            # A string the real response must contain. Status alone is NOT
            # enough — see the step's header.
            smoke_expect: '<div id="root">'
          - app: api
            project_id_secret: VERCEL_API_PROJECT_ID
            # Read-only, no session required, empty result is fine. A 200 here
            # means the function booted AND reached Neon.
            #
            # MULTI-SEGMENT ON PURPOSE. The gameId is a path parameter
            # (`/leaderboard/:gameId`), and a single-segment probe would have
            # missed the routing bug this path exists to catch: Vercel was
            # generating `^/api/([^/]+)$` for the catch-all, so anything with a
            # second slash never reached the function at all.
            #
            # `connect4` is the id the engine actually registers (packages/
            # engine/src/connect4.ts). This probe said `connect-four` for its
            # first month — not a real game. The leaderboard route does not
            # validate the id, so it answered `{"entries":[]}` regardless and
            # the probe still passed; it proved boot + Neon reach but would
            # never have noticed the id was fiction. Keep it a real id so the
            # empty result means "no scores yet", not "no such game".
            # Pinned to the payload's actual shape. A loose marker like "["
            # would match almost any HTML too, which is the whole failure mode
            # this field exists to prevent.
            smoke_expect: '{"entries"'
            smoke_path: /api/leaderboard/connect4
    env:
      # Selects which Vercel project this matrix leg targets. `vercel pull`
      # reads it, so every later step in the leg is scoped to that project.
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      # Fail with a readable message rather than a confusing Vercel auth error
      # if the project-id secret for this leg was never added.
      - name: Check project id secret is set
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret ${{ matrix.project_id_secret }} is not set — the '${{ matrix.app }}' deploy cannot target a Vercel project."
            exit 1
          fi

      # vercel build runs the project's own build, which uses pnpm — it must be
      # on PATH on the runner (otherwise: "Error: spawn pnpm ENOENT").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.flags.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.flags.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          # stdout is the deployment URL; the alias is announced on stderr.
          # Both are captured to files rather than through a pipe, so nothing
          # depends on flush ordering.
          # `if !` rather than `$?`: the default shell runs with `-e`, which
          # would abort before the status could be read.
          if ! vercel deploy --prebuilt ${{ steps.flags.outputs.prod_flag }} \
                 --token=${{ secrets.VERCEL_TOKEN }} >/tmp/deploy.out 2>/tmp/deploy.err; then
            cat /tmp/deploy.err >&2
            exit 1
          fi
          cat /tmp/deploy.err >&2

          url=$(tail -1 /tmp/deploy.out)
          echo "url=$url" >> "$GITHUB_OUTPUT"

          # Prefer the production ALIAS for smoke-testing.
          #
          # `vercel deploy` prints the unique deployment URL on stdout, and that
          # URL is covered by Deployment Protection even in production — so
          # smoking it gets a 302 to SSO and verifies nothing. The alias
          # (mpg-brown / mpg-api-pink) is the public one, and is also what users
          # actually hit. The CLI reports it on stderr as "Aliased <url>".
          alias_url=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/deploy.err \
                      | sed -n 's|.*Aliased[[:space:]]*\(https://[^[:space:]]*\).*|\1|p' \
                      | tail -1)
          smoke_url="${alias_url:-$url}"
          echo "smoke_url=$smoke_url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"
          echo "Alias:      ${alias_url:-<none — preview deploys are not aliased>}"

          {
            echo "### Vercel ${{ matrix.app }} ${{ steps.flags.outputs.environment }} deploy"
            echo ""
            echo "$url"
            # `if`, not `[ … ] && …`: under `set -e` a false test as the final
            # command of the group fails the whole step. It did exactly that on
            # every preview, where there is no alias to report.
            if [ -n "$alias_url" ]; then
              echo ""
              echo "Aliased: $alias_url"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # THE GATE THIS WORKFLOW WAS MISSING.
      #
      # `vercel build` + `vercel deploy` exiting 0 proves the bundle compiled and
      # uploaded. It does NOT prove a function can boot. Both projects deployed
      # green for weeks while every single invocation died at import time
      # (ERR_MODULE_NOT_FOUND on a raw .ts specifier) — found by hand on
      # 2026-09-18, not by CI. One real request is the difference.
      #
      # Production is a hard gate. Previews are best-effort: Deployment
      # Protection puts them behind SSO, so without a bypass secret we cannot
      # reach them — and we do NOT disable protection, because previews talk to
      # the real dev database (MPG-139).
      #
      # TWO RULES LEARNED THE HARD WAY, both on this step's first ever run:
      #
      #  1. DO NOT FOLLOW REDIRECTS. A protected deployment answers 302 to
      #     vercel.com/sso-api, which serves its login page as a cheerful 200.
      #     With `--location` this step reported "Smoke passed (200)" against
      #     Vercel's own login HTML — a false green, in the very step written to
      #     stop false greens.
      #  2. STATUS IS NOT ENOUGH. Each leg declares `smoke_expect`, a string the
      #     body must actually contain, so "some 200 came back" cannot pass for
      #     "our function answered".
      #  3. SMOKE THE ALIAS, NOT THE DEPLOYMENT URL — protection covers the
      #     unique per-deployment hostname even in production, so the first
      #     production run 302'd on both legs and verified nothing. The deploy
      #     step resolves the alias for us (`smoke_url`).
      - name: Smoke-test the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.smoke_url }}
          SMOKE_PATH: ${{ matrix.smoke_path }}
          SMOKE_EXPECT: ${{ matrix.smoke_expect }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          IS_PRODUCTION: ${{ github.event_name == 'push' }}
        run: |
          set -uo pipefail
          url="${DEPLOY_URL}${SMOKE_PATH}"
          echo "Smoke: GET $url"
          echo "Expecting HTTP 200 whose body contains: $SMOKE_EXPECT"

          # No --location, deliberately. See rule 1 above.
          args=(--silent --show-error --max-time 30
                --output /tmp/smoke-body --write-out '%{http_code}')
          if [ -n "$BYPASS" ]; then
            args+=(--header "x-vercel-protection-bypass: $BYPASS")
          fi

          # RETRY, because an alias does not repoint instantly. The first
          # production run of this step queried mpg-api-pink 40ms after deploy
          # and got a platform 404 from the PREVIOUS deployment — a real red
          # against a deploy that was in fact fine (verified by hand seconds
          # later: 200 {"entries":[]}). A gate that cries wolf gets ignored,
          # which would cost more than the bug it is guarding.
          code=000
          for attempt in 1 2 3 4 5 6; do
            code=$(curl "${args[@]}" "$url" || echo "000")
            if [ "$code" = "200" ] && grep -qF -- "$SMOKE_EXPECT" /tmp/smoke-body; then
              break
            fi
            # Protection redirects are terminal — retrying cannot help.
            case "$code" in 3*|401|403) break ;; esac
            if [ "$attempt" -lt 6 ]; then
              echo "attempt $attempt: HTTP $code — retrying in 10s (alias may still be propagating)"
              sleep 10
            fi
          done

          echo "HTTP $code"
          echo "--- first 400 bytes of body ---"
          head -c 400 /tmp/smoke-body || true
          echo

          if [ "$code" = "200" ] && grep -qF -- "$SMOKE_EXPECT" /tmp/smoke-body; then
            echo "::notice::Smoke passed for ${{ matrix.app }} — 200 and the body looks like ours."
            exit 0
          fi

          # A protected preview we have no key for: unreachable, not broken.
          # 3xx is the usual shape (redirect to SSO), 401/403 if it answers directly.
          if [ "$IS_PRODUCTION" != "true" ] && [ -z "$BYPASS" ] \
             && { [ "${code#3}" != "$code" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; }; then
            echo "::warning::Preview for ${{ matrix.app }} is behind Deployment Protection ($code) and no VERCEL_AUTOMATION_BYPASS_SECRET is set — smoke SKIPPED, not passed. This deploy is unverified. See MPG-139."
            exit 0
          fi

          if [ "$code" = "200" ]; then
            echo "::error::Smoke FAILED for ${{ matrix.app }}: got 200 but the body does not contain '$SMOKE_EXPECT' — something answered, but not our function."
          else
            echo "::error::Smoke FAILED for ${{ matrix.app }}: GET $SMOKE_PATH returned $code (expected 200). The deploy succeeded but the function does not work."
          fi
          exit 1

      # THE SECOND GATE THIS WORKFLOW WAS MISSING (found by hand, 2026-09-20).
      #
      # The `mpg` project had NO environment variables at all, which broke two
      # things at once while every check above stayed green:
      #
      #   * `VITE_API_URL` unset at build time → the SPA's `apiFetch` falls back
      #     to same-origin (apps/web/src/api/session.ts), so every call went to
      #     `mpg-brown.vercel.app/api/*` and 404'd. Sessions, leaderboard,
      #     history and share were silently absent in production. The offline
      #     pillar means the games still played perfectly, which is precisely
      #     why nobody noticed.
      #   * `UNFURL_API_ORIGIN` unset at runtime → the shim cannot resolve a
      #     token, so it serves the plain shell and NO share link has ever
      #     unfurled.
      #
      # Both are invisible to a status check and to the shell smoke above, so
      # this step asserts the two observable consequences instead:
      #   1. the shipped JS bundle actually contains the API origin, and
      #   2. a REAL share link, minted here against the API, comes back from
      #      `/s/:token` carrying `og:title`.
      #
      # Needs the repo variable API_ORIGIN (Settings -> Secrets and variables ->
      # Actions -> Variables) set to the API deployment's public origin, the
      # same value the Vercel project's VITE_API_URL/UNFURL_API_ORIGIN carry.
      # Without it the gate cannot know what to look for and warns instead of
      # failing — it is off until someone sets the variable.
      - name: Verify the web app is wired to the API
        if: matrix.app == 'web' && steps.deploy.outputs.smoke_url != ''
        env:
          WEB_URL: ${{ steps.deploy.outputs.smoke_url }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          IS_PRODUCTION: ${{ github.event_name == 'push' }}
        run: |
          set -uo pipefail

          if [ -z "$API_ORIGIN" ]; then
            echo "::warning::Repo variable API_ORIGIN is not set — cannot verify the web app is wired to the API. This deploy is unverified for the share/leaderboard surface. See this step's header."
            exit 0
          fi

          curl_args=(--silent --show-error --max-time 30)
          if [ -n "$BYPASS" ]; then
            curl_args+=(--header "x-vercel-protection-bypass: $BYPASS")
          fi

          fail=0

          # --- 1. Is VITE_API_URL compiled into the SPA? -----------------------
          # The origin is interpolated into every request the client makes, so
          # it appears verbatim in the bundle when it was set, and not at all
          # when it was not.
          #
          # Download the bundle to a FILE and grep the file — NEVER `curl | grep
          # -qF`. `grep -q` exits and closes the pipe on its first match; once
          # the bundle grew past the ~64KB pipe buffer (the ably SDK pushed it
          # to ~670KB), curl is still writing when the pipe closes, takes
          # SIGPIPE, and exits non-zero — which `set -o pipefail` (set at the top
          # of this step) then propagates as a PIPELINE failure even though grep
          # matched. That false negative failed every web deploy after the
          # bundle grew (the match sits ~1/3 into the file, mid-stream), and no
          # amount of retrying fixes it because it is deterministic, not a race.
          # The smoke step and the unfurl check below dodge it only by capturing
          # to a file/variable first; do the same here.
          #
          # The retry is still worth keeping for a genuinely slow alias repoint
          # (same reason the smoke step retries): until the alias serves THIS
          # deploy, `$WEB_URL/` may still list the previous deploy's bundle.
          echo "Checking the shipped bundle references $API_ORIGIN"
          wired=0
          for attempt in 1 2 3 4 5 6; do
            shell_html=$(curl "${curl_args[@]}" "$WEB_URL/")
            bundle=$(printf '%s' "$shell_html" \
                     | sed -n 's|.*<script[^>]*src="\([^"]*\.js\)".*|\1|p' | head -1)
            if [ -n "$bundle" ]; then
              curl "${curl_args[@]}" -o /tmp/spa-bundle.js "$WEB_URL$bundle" || true
              if grep -qF -- "$API_ORIGIN" /tmp/spa-bundle.js; then
                wired=1
                echo "  OK — the bundle ($bundle) targets $API_ORIGIN"
                break
              fi
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "attempt $attempt: bundle not yet serving $API_ORIGIN (alias may still be propagating) — retrying in 10s"
              sleep 10
            fi
          done
          if [ "$wired" -ne 1 ]; then
            echo "::error::The deployed SPA bundle does not contain '$API_ORIGIN' after retries. VITE_API_URL was not set at BUILD time, so the client is calling its own origin for /api/* and every network feature is silently absent. Set it on the Vercel project and redeploy (a rebuild is required — it is baked in at build time)."
            fail=1
          fi

          # --- 2. Does a real share link actually unfurl? ----------------------
          # Posts a genuine (replay-validated) Connect Four win, mints a result
          # link for it, asks the web host to unfurl it, then revokes the link.
          # A working shim injects og:* into the shell; a shim with no API origin
          # returns the shell untouched.
          #
          # A `result` link rather than the cheaper `leaderboard` one on purpose:
          # it is the only kind that carries an `og:image`, so it exercises the
          # card URL this step asserts on. (The leaderboard kind used to 500 here
          # too — `target_id` was a `uuid` column and a leaderboard link targets a
          # game id — fixed by migration 0006.)
          echo "Minting a share link against $API_ORIGIN"
          session=$(curl --silent --show-error --max-time 30 "$API_ORIGIN/api/session" \
                    | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          token=""
          if [ -n "$session" ]; then
            # slot 1 stacks column 0 four high while slot 2 stacks column 1.
            result_id=$(curl --silent --show-error --max-time 30 -X POST "$API_ORIGIN/api/results" \
                          --header "x-session-token: $session" \
                          --header 'content-type: application/json' \
                          --data "{\"runId\":\"deploy-smoke-$GITHUB_RUN_ID\",\"gameId\":\"connect4\",\"durationMs\":4200,\"seatsSnapshot\":[{\"slot\":1,\"kind\":\"human\"},{\"slot\":2,\"kind\":\"bot\",\"difficulty\":\"easy\"}],\"moveLog\":[{\"slot\":1,\"move\":{\"column\":0}},{\"slot\":2,\"move\":{\"column\":1}},{\"slot\":1,\"move\":{\"column\":0}},{\"slot\":2,\"move\":{\"column\":1}},{\"slot\":1,\"move\":{\"column\":0}},{\"slot\":2,\"move\":{\"column\":1}},{\"slot\":1,\"move\":{\"column\":0}}]}" \
                        | sed -n 's/.*"resultId":"\([^"]*\)".*/\1/p')
            if [ -n "$result_id" ]; then
              token=$(curl --silent --show-error --max-time 30 -X POST "$API_ORIGIN/api/share" \
                        --header "x-session-token: $session" \
                        --header 'content-type: application/json' \
                        --data "{\"kind\":\"result\",\"targetId\":\"$result_id\"}" \
                      | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            fi
          fi

          if [ -z "$token" ]; then
            echo "::warning::Could not mint a share link against $API_ORIGIN — skipping the unfurl check. The API leg of this workflow covers whether the API itself is healthy."
          else
            # Retry for the same alias-propagation reason as the bundle check
            # above: until the web alias serves this deploy, `/s/:token` is
            # answered by the previous deploy's shim and may not inject og:*
            # yet. Mint the link once (above) and only re-fetch the unfurl here.
            echo "Unfurling $WEB_URL/s/$token"
            unfurled=0
            for attempt in 1 2 3 4 5 6; do
              # Capture to a variable, then grep the variable — same reason as the
              # bundle check above: never pipe a large body straight into `grep
              # -q` under `pipefail`. The unfurl shell is small, but keep the
              # pattern consistent so this can't regress the way probe 1 did.
              body=$(curl "${curl_args[@]}" "$WEB_URL/s/$token")
              # og:image too, not just og:title: it is the half that has to carry
              # the API origin into the markup, so it is what proves the shim was
              # configured rather than merely reachable.
              if printf '%s' "$body" | grep -qF 'property="og:title"' \
                 && printf '%s' "$body" | grep -qF "property=\"og:image\" content=\"$API_ORIGIN"; then
                unfurled=1
                echo "  OK — the shim resolved the token and injected og:* tags"
                break
              fi
              if [ "$attempt" -lt 6 ]; then
                echo "attempt $attempt: /s/:token not unfurling yet (alias may still be propagating) — retrying in 10s"
                sleep 10
              fi
            done
            if [ "$unfurled" -ne 1 ]; then
              echo "::error::GET /s/<a REAL token> returned no og:title after retries — the unfurl shim could not resolve it, so every shared link unfurls as a bare URL. Set UNFURL_API_ORIGIN on the Vercel project."
              fail=1
            fi
            # Best-effort cleanup; a leftover link is harmless but untidy.
            curl --silent --max-time 30 -X DELETE "$API_ORIGIN/api/share/$token" \
              --header "x-session-token: $session" >/dev/null || true
          fi

          if [ "$fail" -ne 0 ]; then
            # Previews behind Deployment Protection we have no key for cannot be
            # read at all; do not report that as a wiring failure.
            if [ "$IS_PRODUCTION" != "true" ] && [ -z "$BYPASS" ]; then
              echo "::warning::Preview could not be verified (likely Deployment Protection with no bypass secret) — treating as unverified rather than broken."
              exit 0
            fi
            exit 1
          fi
          echo "::notice::Web deployment is correctly wired to $API_ORIGIN."

      # `always()`: a failed smoke must still leave the URL on the PR — that is
      # exactly when someone needs to go and look at it.
      - name: Comment preview URL on PR
        if: always() && github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          APP: ${{ matrix.app }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            const app = process.env.APP;
            // Per-app marker so the two matrix legs update their own comment
            // instead of overwriting each other.
            const marker = `<!-- vercel-preview-url-${app} -->`;
            const body = `${marker}\n**Preview deploy (${app}):** ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
