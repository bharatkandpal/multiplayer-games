name: Deploy

# Drives Vercel via its CLI so GitHub Actions owns the deploy:
#   push to main   -> production deploy
#   pull_request   -> preview deploy (comment left on the PR)
#
# Two Vercel projects deploy from this one repo, as a matrix:
#   web  -> `mpg`      (Root Directory apps/web) — the Vite SPA + unfurl shim
#   api  -> `mpg-api`  (Root Directory apps/api) — stateless functions + Neon
#
# Each runs from the repo root; Vercel resolves the app from the project's own
# Root Directory setting, which is what makes the pnpm workspace deps resolve.
#
# Requires four repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN           - https://vercel.com/account/tokens
#   VERCEL_ORG_ID          - from `.vercel/project.json` after `vercel link`, or Team Settings
#   VERCEL_PROJECT_ID      - the `mpg` project id (web)
#   VERCEL_API_PROJECT_ID  - the `mpg-api` project id
#
# Optional fifth secret:
#   VERCEL_AUTOMATION_BYPASS_SECRET - Protection Bypass for Automation token
#     (Vercel project -> Settings -> Deployment Protection). Without it the
#     post-deploy smoke step cannot reach PREVIEW deployments and will warn
#     rather than verify. Do not disable Deployment Protection instead:
#     previews are wired to the real dev database (MPG-139).
#
# Double deploys are prevented per project by `git.deploymentEnabled=false` in
# each app's vercel.json, so Vercel ignores pushes and this workflow is the only
# thing that deploys. (Those files live in each app dir because that's the
# project's Root Directory — move them if you change that setting.)
#
# The two projects deploy independently (fail-fast is off): a broken API build
# must not block shipping the client, which stays playable with the API absent.

on:
  push:
    branches: [main]
  pull_request:

# One in-flight deploy per branch; newer pushes cancel stale runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

# Least-privilege GITHUB_TOKEN: the deploy needs nothing writable except the
# ability to post/update the preview-URL comment on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Vercel ${{ matrix.app }} (${{ github.event_name == 'push' && 'production' || 'preview' }})
    runs-on: ubuntu-latest
    # Skip PRs from forks: secrets aren't exposed to them, so the deploy can't run.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      # Deploy both even if one fails — see header.
      fail-fast: false
      matrix:
        include:
          - app: web
            project_id_secret: VERCEL_PROJECT_ID
            # Exercises the unfurl function (ADR 0009). A junk token is the
            # documented degrade-to-shell path, so 200 is the correct answer —
            # and it proves the function BOOTED, which is the point.
            smoke_path: /s/deploysmoketoken
            # A string the real response must contain. Status alone is NOT
            # enough — see the step's header.
            smoke_expect: '<div id="root">'
          - app: api
            project_id_secret: VERCEL_API_PROJECT_ID
            # Read-only, no session required, empty result is fine. A 200 here
            # means the function booted AND reached Neon.
            # `[` pins it to a JSON array — the leaderboard's real shape.
            smoke_expect: "["
            smoke_path: /api/leaderboard?gameId=connect-four
    env:
      # Selects which Vercel project this matrix leg targets. `vercel pull`
      # reads it, so every later step in the leg is scoped to that project.
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      # Fail with a readable message rather than a confusing Vercel auth error
      # if the project-id secret for this leg was never added.
      - name: Check project id secret is set
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret ${{ matrix.project_id_secret }} is not set — the '${{ matrix.app }}' deploy cannot target a Vercel project."
            exit 1
          fi

      # vercel build runs the project's own build, which uses pnpm — it must be
      # on PATH on the runner (otherwise: "Error: spawn pnpm ENOENT").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.flags.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.flags.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.flags.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel ${{ matrix.app }} ${{ steps.flags.outputs.environment }} deploy"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      # THE GATE THIS WORKFLOW WAS MISSING.
      #
      # `vercel build` + `vercel deploy` exiting 0 proves the bundle compiled and
      # uploaded. It does NOT prove a function can boot. Both projects deployed
      # green for weeks while every single invocation died at import time
      # (ERR_MODULE_NOT_FOUND on a raw .ts specifier) — found by hand on
      # 2026-09-18, not by CI. One real request is the difference.
      #
      # Production is a hard gate. Previews are best-effort: Deployment
      # Protection puts them behind SSO, so without a bypass secret we cannot
      # reach them — and we do NOT disable protection, because previews talk to
      # the real dev database (MPG-139).
      #
      # TWO RULES LEARNED THE HARD WAY, both on this step's first ever run:
      #
      #  1. DO NOT FOLLOW REDIRECTS. A protected deployment answers 302 to
      #     vercel.com/sso-api, which serves its login page as a cheerful 200.
      #     With `--location` this step reported "Smoke passed (200)" against
      #     Vercel's own login HTML — a false green, in the very step written to
      #     stop false greens.
      #  2. STATUS IS NOT ENOUGH. Each leg declares `smoke_expect`, a string the
      #     body must actually contain, so "some 200 came back" cannot pass for
      #     "our function answered".
      - name: Smoke-test the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SMOKE_PATH: ${{ matrix.smoke_path }}
          SMOKE_EXPECT: ${{ matrix.smoke_expect }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          IS_PRODUCTION: ${{ github.event_name == 'push' }}
        run: |
          set -uo pipefail
          url="${DEPLOY_URL}${SMOKE_PATH}"
          echo "Smoke: GET $url"
          echo "Expecting HTTP 200 whose body contains: $SMOKE_EXPECT"

          # No --location, deliberately. See rule 1 above.
          args=(--silent --show-error --max-time 30
                --output /tmp/smoke-body --write-out '%{http_code}')
          if [ -n "$BYPASS" ]; then
            args+=(--header "x-vercel-protection-bypass: $BYPASS")
          fi

          code=$(curl "${args[@]}" "$url" || echo "000")
          echo "HTTP $code"
          echo "--- first 400 bytes of body ---"
          head -c 400 /tmp/smoke-body || true
          echo

          if [ "$code" = "200" ] && grep -qF -- "$SMOKE_EXPECT" /tmp/smoke-body; then
            echo "::notice::Smoke passed for ${{ matrix.app }} — 200 and the body looks like ours."
            exit 0
          fi

          # A protected preview we have no key for: unreachable, not broken.
          # 3xx is the usual shape (redirect to SSO), 401/403 if it answers directly.
          if [ "$IS_PRODUCTION" != "true" ] && [ -z "$BYPASS" ] \
             && { [ "${code#3}" != "$code" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; }; then
            echo "::warning::Preview for ${{ matrix.app }} is behind Deployment Protection ($code) and no VERCEL_AUTOMATION_BYPASS_SECRET is set — smoke SKIPPED, not passed. This deploy is unverified. See MPG-139."
            exit 0
          fi

          if [ "$code" = "200" ]; then
            echo "::error::Smoke FAILED for ${{ matrix.app }}: got 200 but the body does not contain '$SMOKE_EXPECT' — something answered, but not our function."
          else
            echo "::error::Smoke FAILED for ${{ matrix.app }}: GET $SMOKE_PATH returned $code (expected 200). The deploy succeeded but the function does not work."
          fi
          exit 1

      # `always()`: a failed smoke must still leave the URL on the PR — that is
      # exactly when someone needs to go and look at it.
      - name: Comment preview URL on PR
        if: always() && github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          APP: ${{ matrix.app }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            const app = process.env.APP;
            // Per-app marker so the two matrix legs update their own comment
            // instead of overwriting each other.
            const marker = `<!-- vercel-preview-url-${app} -->`;
            const body = `${marker}\n**Preview deploy (${app}):** ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
