name: Verify

# MANUAL ONLY. As of 2026-09-22 this no longer runs on push or pull_request —
# verification moved to local git hooks (.husky/pre-commit + .husky/pre-push).
# See docs/DEVELOPER_GUIDE.md "Local verification".
#
# It is kept, and kept dispatchable, for the two things a local hook cannot do:
#
#   1. Run the FULL suite including packages/engine/src/ai/difficulty.test.ts —
#      a depth-7 minimax sweep that `test:fast` excludes, so pre-push never sees
#      it. Without this workflow that test has no home at all (MPG-151).
#   2. Verify a MERGED result. Hooks only ever see one developer's working tree;
#      they cannot catch two independently-green branches that conflict once
#      combined.
#
# Costs nothing while idle — workflow_dispatch consumes minutes only when you
# actually trigger it, from the Actions tab or `gh workflow run ci.yml`.
on:
  workflow_dispatch:

jobs:
  verify:
    name: typecheck · lint · format · test (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test
